aid: bonfire-ventures
name: Bonfire Ventures
description: >-
  Bonfire Ventures is a Los Angeles-based, seed-stage venture capital firm co-founded by Mark Mullen
  and Jim Andelman that invests exclusively in business-to-business (B2B) software companies, with a
  current focus on AI-native B2B founders. The firm runs a low-volume, high-conviction, high-support
  model — backing roughly 10 to 12 new companies a year, leading approximately 95% of the rounds it
  participates in and taking board seats — and positions itself as "AI-native too," operating an
  in-house AI system called Bonnie to source and support founders. Bonfire reports more than $18B in
  cumulative exit value across its history, with notable outcomes including TaxJar (acquired by
  Stripe), MNTN (IPO), The Trade Desk, Scopely, Moat (acquired by Oracle), and Comparably (acquired by
  ZoomInfo). It was added to the API Evangelist network as a portfolio company of Foundry Group and
  enriched from the firm's public site.
